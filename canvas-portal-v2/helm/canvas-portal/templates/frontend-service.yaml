apiVersion: v1
kind: Service
metadata:
  name: {{ include "canvas-portal.frontend.fullname" . }}
  labels:
    {{- include "canvas-portal.frontend.labels" . | nindent 4 }}
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "canvas-portal.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  {{- with .Values.frontend.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
