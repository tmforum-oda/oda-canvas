{{- if .Values.preqrequisitechecks.istio }}
apiVersion: batch/v1
kind: Job
metadata:
  name: pre-install-check-istio
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccount: canvas-sm-prehook-sa
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- include "image-pull-secrets" . |nindent 6 }}
      {{- end }}
      containers:
      - name: check-istio
        image: {{ include "docker.registry" .}}{{ .Values.global.hookImages.kubectlCurl }}
        command:
            - /bin/sh
            - -c
            - |
              echo "=== Verifying Istio Prerequisites ==="
              
              # Check 1: istio-system namespace exists
              ISTIO_NS=$(kubectl get namespace istio-system --ignore-not-found)
              if [ -z "$ISTIO_NS" ]; then
                echo "ERROR: istio-system namespace not found."
                echo "Please deploy the prerequisites repository first to install Istio control plane (istio-base + istiod)."
                exit 1
              fi
              echo "✓ istio-system namespace exists"
              
              # Check 2: istiod pod is running
              ISTIOD_POD=$(kubectl get pods -n istio-system -l app=istiod -o jsonpath='{.items[0].metadata.name}' --ignore-not-found)
              if [ -z "$ISTIOD_POD" ]; then
                echo "ERROR: istiod pod not found in istio-system namespace."
                echo "Please ensure the prerequisites repository has successfully deployed Istio."
                exit 1
              fi
              ISTIOD_STATUS=$(kubectl get pod "$ISTIOD_POD" -n istio-system -o jsonpath='{.status.phase}')
              if [ "$ISTIOD_STATUS" != "Running" ]; then
                echo "ERROR: istiod pod is in state: $ISTIOD_STATUS (expected: Running)"
                echo "Please wait for the prerequisites Istio deployment to be ready."
                exit 1
              fi
              echo "✓ istiod pod is running in istio-system"
              
              # Check 3: Istio CRDs are available
              echo "Checking Istio CRDs..."
              for CRD in virtualservices.networking.istio.io gateways.networking.istio.io; do
                CRD_CHECK=$(kubectl get crd "$CRD" --ignore-not-found)
                if [ -z "$CRD_CHECK" ]; then
                  echo "ERROR: Required Istio CRD '$CRD' not found."
                  exit 1
                fi
                echo "✓ CRD $CRD exists"
              done
              
              echo ""
              echo "=== Verifying Canvas Istio Ingress ==="
              
              # Check 4: istio-ingress service exists (Canvas will install this)
              SERVICE=$(kubectl get svc istio-ingress -n istio-ingress --ignore-not-found)
              if [ -z "$SERVICE" ]; then
                echo "✓ istio-ingress service will be created during Canvas deployment"
              else
                # Get the service type
                SERVICE_TYPE=$(kubectl get svc istio-ingress -n istio-ingress -o jsonpath='{.spec.type}')
                echo "✓ Service 'istio-ingress' exists with type: $SERVICE_TYPE"
            
                if [ "$SERVICE_TYPE" = "LoadBalancer" ]; then
                  # Check if the service has an external IP
                  EXTERNAL_IP=$(kubectl get svc istio-ingress -n istio-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
                  if [ -z "$EXTERNAL_IP" ]; then
                    EXTERNAL_IP=$(kubectl get svc istio-ingress -n istio-ingress -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                  fi
                  if [ -n "$EXTERNAL_IP" ]; then
                    echo "✓ Service 'istio-ingress' has external IP: $EXTERNAL_IP"
                  else
                    echo "⚠ Service 'istio-ingress' is LoadBalancer but external IP not yet allocated (normal during upgrade)"
                  fi
                elif [ "$SERVICE_TYPE" = "ClusterIP" ]; then
                  echo "✓ Service 'istio-ingress' is ClusterIP type"
                fi
              fi
              
              echo ""
              echo "=== All Prerequisites Verified Successfully ==="
              echo "Canvas installation may proceed."
      restartPolicy: Never
{{- end }}
