apiVersion: v1
kind: Service
metadata:
  name: carbon-intensity-service
  # Fixed service name for stable DNS: carbon-intensity-service.canvas.svc.cluster.local
  labels:
    app: {{ .Release.Name }}-carbon-intensity
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8628
  selector:
    app: {{ .Release.Name }}-carbon-intensity
