# Default values for cert-manager-init.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
 certificate:
   appName: "compcrdwebhook "

istioCert:
  namespace: "istio-ingress"
  certificate:
    duration: 21600h
    renewBefore: 360h 

nameOverride: ""
fullnameOverride: ""
namespace: canvas
certificate:
  appName: "compcrdwebhook "
#The post-install hook waits until the cert-manager webhook can admit an Issuer before creating
#the Issuers and Certificates. Creating them earlier (e.g. while cert-manager images are still
#downloading, or while the cainjector waits for a leftover leader-election lease) fails with
#  cert-manager-init/templates/issuer.yaml failed: Internal error occurred:
#  failed calling webhook "webhook.cert-manager.io": failed to call webhook:
#  Post "https://cert-manager-webhook.cert-manager.svc:443/mutate?timeout=10s": x509: certificate signed by unknown authority
#Maximum time to wait, in seconds
certManagerReadyTimeout: 600

cert-manager:
  enabled: true
  installCRDs: true
  namespace: cert-manager