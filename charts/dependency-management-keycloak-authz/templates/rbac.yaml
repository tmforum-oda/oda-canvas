---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-management-keycloak-authz-account
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-management-keycloak-authz-cluster-role
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
rules:

  # Framework: kopf peering so multiple operators can coexist.
  - apiGroups: [zalando.org]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]
  - apiGroups: [zalando.org]
    resources: [kopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: CRD discovery.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch, get]

  # Framework: posting events about handler progress and errors.
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: watch the operator's own ConfigMap to anchor the daemon.
  # patch is required by kopf to store finalizers and handler progress state.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, watch, get, patch]

  # Application: list and patch DependentAPI and ExposedAPI resources to resolve dependencies
  # and to propagate DependentAPI ready/url status back to the parent Component.
  - apiGroups: [oda.tmforum.org]
    resources: [dependentapis, exposedapis]
    verbs: [list, get, patch]
  - apiGroups: [oda.tmforum.org]
    resources: [dependentapis/status]
    verbs: [get, patch, update]

  # Application: patch parent Component status when a DependentAPI becomes ready.
  - apiGroups: [oda.tmforum.org]
    resources: [components]
    verbs: [list, watch, get, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-management-keycloak-authz-cluster-role-binding
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-management-keycloak-authz-cluster-role
subjects:
  - kind: ServiceAccount
    name: dependency-management-keycloak-authz-account
    namespace: {{ .Release.Namespace }}
