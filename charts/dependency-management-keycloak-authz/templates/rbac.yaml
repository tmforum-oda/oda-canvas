---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-management-keycloak-authz-account
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-management-keycloak-authz-cluster-role
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
rules:

  # Framework: kopf peering so multiple operators can coexist.
  - apiGroups: [zalando.org]
    resources: [clusterkopfpeerings]
    verbs: [list, watch, patch, get]
  - apiGroups: [zalando.org]
    resources: [kopfpeerings]
    verbs: [list, watch, patch, get]

  # Framework: CRD discovery.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch, get]

  # Framework: posting events about handler progress and errors.
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: watch the operator's own ConfigMap to anchor the daemon.
  # The daemon starts when the ConfigMap named
  # dependency-management-keycloak-authz-configmap is detected.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, watch, get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-management-keycloak-authz-cluster-role-binding
  labels:
    {{- include "dependency-management-keycloak-authz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-management-keycloak-authz-cluster-role
subjects:
  - kind: ServiceAccount
    name: dependency-management-keycloak-authz-account
    namespace: {{ .Release.Namespace }}
