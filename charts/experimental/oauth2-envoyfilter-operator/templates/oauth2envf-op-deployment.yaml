apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    oda.tmforum.org/operator: "true"
    oda.tmforum.org/operatorName: oauth2-envoy-filter-operator
    oda.tmforum.org/operatorId: TMFOP008
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-account
      containers:
      - name: oauth2envf-op
        image: {{ include "oauth2-envoyfilter-operator.dockerimage" . }}
        imagePullPolicy: {{ include "oauth2-envoyfilter-operator.imagePullPolicy" . }}
        env:
        - name: LOGGING
          value: "{{ .Values.loglevel }}"
        - name: CANVAS_INFO_ENDPOINT
          value: "{{ .Values.canvasInfoServiceURL }}"
        ports:
        - containerPort: 9443
