name: Canvas Portal v2 backend unit tests
on:
  pull_request:
    branches:
      - main
    paths:
      - 'canvas-portal-v2/backend/**'
      - '.github/workflows/canvas-portal-v2-backend-unit-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal-v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            canvas-portal-v2/backend/requirements.txt
            canvas-portal-v2/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
