name: trigger_test

# Runs the BDD features a pull request affects, chosen by
# feature-definition-and-test-kit/test-selection.yaml (see Executing-tests.md).
# Kong and APISIX features run on their own cluster with that gateway
# installed instead of Istio. Run the workflow from the Actions tab to run the
# full suite against a branch or tag, for example before a release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (default the branch selected above). Runs the full suite.
        required: false
        default: ''
  pull_request:
    branches:
    - main

jobs:

  # Decides whether to skip the tests and selects the features to run (see
  # .github/actions/select-bdd-tests). The same selection is posted on the PR
  # by the BDD test selection comment workflow.
  check_skip_tests_job:
    runs-on: ubuntu-latest
    outputs:
      SKIP_REASON: ${{ steps.select.outputs.SKIP_REASON }}
      MODE: ${{ steps.select.outputs.MODE }}
      RUN_DEFAULT: ${{ steps.select.outputs.RUN_DEFAULT }}
      DEFAULT_TAGS: ${{ steps.select.outputs.DEFAULT_TAGS }}
      GATEWAY_RUNS: ${{ steps.select.outputs.GATEWAY_RUNS }}
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        fetch-depth: 2    # this is needed for getting the diff of the last commit

    - name: Select BDD tests
      id: select
      uses: ./.github/actions/select-bdd-tests


  # The default run, on a canvas with Istio. It's skipped when the selection
  # has no features for it, for example for a documentation-only PR.
  run_tests_job:
    runs-on: ubuntu-latest
    # A full run takes about 30 minutes; each failing scenario can add up to
    # 10 minutes of timeouts
    timeout-minutes: 180
    needs: check_skip_tests_job
    if: "needs.check_skip_tests_job.outputs.SKIP_REASON == '' && needs.check_skip_tests_job.outputs.RUN_DEFAULT == 'true'"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

    - name: Run BDD tests
      uses: ./.github/actions/run-bdd-tests
      with:
        tags: ${{ needs.check_skip_tests_job.outputs.DEFAULT_TAGS }}
        report-name: test-report


  # One run for each gateway with selected features (Kong, APISIX), each on
  # its own cluster with that gateway installed instead of Istio.
  run_gateway_tests_job:
    name: run_gateway_tests_job (${{ matrix.run.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check_skip_tests_job
    if: "needs.check_skip_tests_job.outputs.SKIP_REASON == '' && needs.check_skip_tests_job.outputs.GATEWAY_RUNS != '' && needs.check_skip_tests_job.outputs.GATEWAY_RUNS != '[]'"
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.check_skip_tests_job.outputs.GATEWAY_RUNS) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

    - name: Run BDD tests
      uses: ./.github/actions/run-bdd-tests
      with:
        tags: ${{ matrix.run.tags }}
        helm-set: ${{ matrix.run.helmSet }}
        pre-install: ${{ matrix.run.preInstall }}
        report-name: test-report-${{ matrix.run.name }}


# ---------------------
# Build and push badges
# ---------------------
  # The badges count the whole suite, so only full runs update them.
  build_badges_job:
    if: ${{ always() && needs.check_skip_tests_job.outputs.MODE == 'full' && (needs.run_tests_job.result == 'success' || needs.run_tests_job.result == 'failure') }}
    runs-on: ubuntu-latest
    needs: [check_skip_tests_job, run_tests_job, run_gateway_tests_job]
    permissions:
      contents: write
    steps:
      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-report*
          path: /tmp/reports

      - name: Merge cucumber reports
        id: download_report
        continue-on-error: true
        run: |
          find /tmp/reports -name cucumber.json | tee /tmp/report-files.txt
          [ -s /tmp/report-files.txt ]
          xargs jq -s 'add' < /tmp/report-files.txt > /tmp/cucumber.json

      - name: Skip badge generation
        if: steps.download_report.outcome != 'success'
        run: echo "test-report artifact not found; skipping badge generation."

      - name: Parse cucumber results 
        id: parse_results
        if: steps.download_report.outcome == 'success'
        run: |
          failed=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( any($s[]; .=="failed") ) ] | length' /tmp/cucumber.json)
          undefined=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed")|not) and any($s[]; .=="undefined" or .=="pending" or .=="ambiguous") ) ] | length' /tmp/cucumber.json)
          skipped=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed" or .=="undefined" or .=="pending" or .=="ambiguous")|not) and ($s|length>0) and all($s[]; .=="skipped") ) ] | length' /tmp/cucumber.json)
          passed=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed" or .=="undefined" or .=="pending" or .=="ambiguous")|not) and any($s[]; .=="passed") ) ] | length' /tmp/cucumber.json)
          {
            echo "passed=$passed"
            echo "failed=$failed"
            echo "undefined=$undefined"
            echo "skipped=$skipped"
          } >> "$GITHUB_OUTPUT"

      - name: Badge - Passed
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with: 
          name: bdd-passed
          label: Passed
          status: ${{ steps.parse_results.outputs.passed }}
          color: brightgreen
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          branch: byob-badges
          path: bdd-passed.json

      - name: Badge - Failed 
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with: 
          name: bdd-failed
          label: Failed
          status: ${{ steps.parse_results.outputs.failed }}
          color: ${{ steps.parse_results.outputs.failed == '0' && 'brightgreen' || 'red' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          branch: byob-badges
          path: bdd-failed.json

      - name: Badge - Undefined
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: bdd-undefined
          label: Undefined
          status: ${{ steps.parse_results.outputs.undefined }}
          color: ${{ steps.parse_results.outputs.undefined == '0' && 'brightgreen' || 'orange' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: byob-badges
          path: bdd-undefined.json

      - name: Badge - Skipped
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: bdd-skipped
          label: Skipped
          status: ${{ steps.parse_results.outputs.skipped }}
          color: ${{ steps.parse_results.outputs.skipped == '0' && 'brightgreen' || 'lightblue' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: byob-badges
          path: bdd-skipped.json