name: trigger_test

# Runs the BDD features a pull request affects, chosen by
# feature-definition-and-test-kit/test-selection.yaml (see Executing-tests.md).
# Kong and APISIX features run on their own cluster with that gateway
# installed instead of Istio. Run the workflow from the Actions tab to run the
# full suite against a branch or tag, for example before a release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (default the branch selected above). Runs the full suite.
        required: false
        default: ''
  pull_request:
    branches:
    - main

jobs:

  check_skip_tests_job:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[skip tests]')"
    outputs:
      COMMITMSG_SKIPTESTS: ${{ steps.check_skiptests_msg.outputs.SKIPTESTS }}
      PRERELEASESUFFIX_SKIPTESTS: ${{ steps.check_prereleasesuffixremoval.outputs.SKIPTESTS }}
      MODE: ${{ steps.select_features.outputs.MODE }}
      RUN_DEFAULT: ${{ steps.select_features.outputs.RUN_DEFAULT }}
      DEFAULT_TAGS: ${{ steps.select_features.outputs.DEFAULT_TAGS }}
      GATEWAY_RUNS: ${{ steps.select_features.outputs.GATEWAY_RUNS }}
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        fetch-depth: 2    # this is needed for getting the diff of the last commit

    - name: Check for [skip tests] in Message
      id: check_skiptests_msg
      if: github.event_name == 'pull_request'
      run: |
        message=$(git log -1 --format=oneline --pretty=format:"%s")
        echo "GIT COMMIT MESSAGE: $message"
        if echo $message | grep "\[skip tests\]" >/dev/null
        then
          echo "SKIPPING TESTS"
          echo "SKIPTESTS=1" >> $GITHUB_OUTPUT
        else
          echo "'[skip tests]' magic words were not found in commit message, not skipping tests"
        fi

    - name: check last commit contains only prerelease suffix removals
      id: check_prereleasesuffixremoval
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        echo "---- CHANGED FILES ----"
        git diff --name-only HEAD~1
        echo "---- ------------- ----"
        export CHANGED_FILES=$(git diff --name-only HEAD~1)
        if [ "$CHANGED_FILES" == "charts/canvas-oda/values.yaml" ]
        then
          echo "only charts/canvas-oda/values.yaml was changed."
          echo "checking changes if only prerelease suffixes were removed."

          echo "---- DIFF FROM LAST COMMIT ----"
          git diff -w -U0 --color=always HEAD~1
          echo "---- --------------------- ----"

          git diff -w -U0 --color=never HEAD~1 > gitdiff.txt
          export OLD_LINES=$(cat gitdiff.txt | grep -i "^- " | wc -l)
          export NEW_LINES=$(cat gitdiff.txt | grep -i "^+ " | wc -l)
          export NEW_LINES_WITH_EMPTY_PRS=$(cat gitdiff.txt | grep -i "^+ .*prereleasesuffix:\s*$" | wc -l)

          echo "OLD LINES ($OLD_LINES)"
          cat gitdiff.txt | grep -i "^- " || true
          echo "---- -------------------- ----"
          echo "NEW LINES ($NEW_LINES)"
          cat gitdiff.txt | grep -i "^+ " || true
          echo "---- -------------------- ----"
          echo "NEW LINES WITH EMPTY PRERELEASESUFFIX ($NEW_LINES_WITH_EMPTY_PRS)"
          cat gitdiff.txt | grep -i "^+ .*prereleasesuffix:\s*$" || true
          echo "---- -------------------- ----"

          if [ "$OLD_LINES" != "$NEW_LINES" ]
          then
            echo "Number of old lines and new lines differs, not skipping tests"
          else
            if [ "$NEW_LINES" != "$NEW_LINES_WITH_EMPTY_PRS" ]
            then
              echo "not all new lines are empty prereleasesuffixes, not skipping tests"
            else
              echo "detected only prerelease suffix removals in changed files"
              echo "SKIPPING TESTS"
              echo "SKIPTESTS=1" >> $GITHUB_OUTPUT
            fi
          fi
        else
          echo "changes to other files than values.yaml detected, not skipping tests"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Lists the files the whole PR changes (not just the last commit), with
    # their diffs, through the API, which also works for PRs from forks.
    # Renamed files count under both their old and new paths. The selector
    # reads the diffs of the canvas-oda chart to see which sections changed.
    - name: Select BDD features
      id: select_features
      shell: bash
      working-directory: feature-definition-and-test-kit
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        npm install --no-audit --no-fund
        if [ "$EVENT_NAME" = "pull_request" ]; then
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --slurp > /tmp/pr-files.json
          SELECT_ARGS=(--pr-files /tmp/pr-files.json)
        else
          SELECT_ARGS=(--all)
        fi
        node test-selection/select-features.js "${SELECT_ARGS[@]}" --format json > /tmp/test-selection.json
        node test-selection/select-features.js "${SELECT_ARGS[@]}" | tee /tmp/test-selection.txt
        {
          echo "## BDD test selection"
          echo
          echo '```'
          cat /tmp/test-selection.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        node test-selection/select-features.js "${SELECT_ARGS[@]}" --format github-output | tee -a "$GITHUB_OUTPUT"

    - name: Upload test selection
      uses: actions/upload-artifact@v4
      with:
        name: test-selection
        path: |
          /tmp/test-selection.json
          /tmp/test-selection.txt
          /tmp/pr-files.json
        if-no-files-found: ignore


  # The default run, on a canvas with Istio. It's skipped when the selection
  # has no features for it, for example for a documentation-only PR.
  run_tests_job:
    runs-on: ubuntu-latest
    needs: check_skip_tests_job
    if: "!needs.check_skip_tests_job.outputs.COMMITMSG_SKIPTESTS && !needs.check_skip_tests_job.outputs.PRERELEASESUFFIX_SKIPTESTS && needs.check_skip_tests_job.outputs.RUN_DEFAULT == 'true'"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

    - name: Run BDD tests
      uses: ./.github/actions/run-bdd-tests
      with:
        tags: ${{ needs.check_skip_tests_job.outputs.DEFAULT_TAGS }}
        report-name: test-report


  # One run for each gateway with selected features (Kong, APISIX), each on
  # its own cluster with that gateway installed instead of Istio.
  run_gateway_tests_job:
    name: run_gateway_tests_job (${{ matrix.run.name }})
    runs-on: ubuntu-latest
    needs: check_skip_tests_job
    if: "!needs.check_skip_tests_job.outputs.COMMITMSG_SKIPTESTS && !needs.check_skip_tests_job.outputs.PRERELEASESUFFIX_SKIPTESTS && needs.check_skip_tests_job.outputs.GATEWAY_RUNS != '' && needs.check_skip_tests_job.outputs.GATEWAY_RUNS != '[]'"
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.check_skip_tests_job.outputs.GATEWAY_RUNS) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || inputs.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

    - name: Run BDD tests
      uses: ./.github/actions/run-bdd-tests
      with:
        tags: ${{ matrix.run.tags }}
        helm-set: ${{ matrix.run.helmSet }}
        pre-install: ${{ matrix.run.preInstall }}
        report-name: test-report-${{ matrix.run.name }}


# ---------------------
# Build and push badges
# ---------------------
  # The badges count the whole suite, so only full runs update them.
  build_badges_job:
    if: ${{ always() && needs.check_skip_tests_job.outputs.MODE == 'full' && (needs.run_tests_job.result == 'success' || needs.run_tests_job.result == 'failure') }}
    runs-on: ubuntu-latest
    needs: [check_skip_tests_job, run_tests_job, run_gateway_tests_job]
    permissions:
      contents: write
    steps:
      - name: Download test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-report*
          path: /tmp/reports

      - name: Merge cucumber reports
        id: download_report
        continue-on-error: true
        run: |
          find /tmp/reports -name cucumber.json | tee /tmp/report-files.txt
          [ -s /tmp/report-files.txt ]
          xargs jq -s 'add' < /tmp/report-files.txt > /tmp/cucumber.json

      - name: Skip badge generation
        if: steps.download_report.outcome != 'success'
        run: echo "test-report artifact not found; skipping badge generation."

      - name: Parse cucumber results 
        id: parse_results
        if: steps.download_report.outcome == 'success'
        run: |
          failed=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( any($s[]; .=="failed") ) ] | length' /tmp/cucumber.json)
          undefined=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed")|not) and any($s[]; .=="undefined" or .=="pending" or .=="ambiguous") ) ] | length' /tmp/cucumber.json)
          skipped=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed" or .=="undefined" or .=="pending" or .=="ambiguous")|not) and ($s|length>0) and all($s[]; .=="skipped") ) ] | length' /tmp/cucumber.json)
          passed=$(jq '[ .[] | .elements[] | ([ .steps[]? | select((.hidden // false)|not) | .result.status ]) as $s | select( (any($s[]; .=="failed" or .=="undefined" or .=="pending" or .=="ambiguous")|not) and any($s[]; .=="passed") ) ] | length' /tmp/cucumber.json)
          {
            echo "passed=$passed"
            echo "failed=$failed"
            echo "undefined=$undefined"
            echo "skipped=$skipped"
          } >> "$GITHUB_OUTPUT"

      - name: Badge - Passed
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with: 
          name: bdd-passed
          label: Passed
          status: ${{ steps.parse_results.outputs.passed }}
          color: brightgreen
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          branch: byob-badges
          path: bdd-passed.json

      - name: Badge - Failed 
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with: 
          name: bdd-failed
          label: Failed
          status: ${{ steps.parse_results.outputs.failed }}
          color: ${{ steps.parse_results.outputs.failed == '0' && 'brightgreen' || 'red' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          branch: byob-badges
          path: bdd-failed.json

      - name: Badge - Undefined
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: bdd-undefined
          label: Undefined
          status: ${{ steps.parse_results.outputs.undefined }}
          color: ${{ steps.parse_results.outputs.undefined == '0' && 'brightgreen' || 'orange' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: byob-badges
          path: bdd-undefined.json

      - name: Badge - Skipped
        if: steps.download_report.outcome == 'success'
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          name: bdd-skipped
          label: Skipped
          status: ${{ steps.parse_results.outputs.skipped }}
          color: ${{ steps.parse_results.outputs.skipped == '0' && 'brightgreen' || 'lightblue' }}
          icon: cucumber
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: byob-badges
          path: bdd-skipped.json