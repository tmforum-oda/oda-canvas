apiVersion: batch/v1
kind: Job
metadata:
  name: {{.Release.Name}}-agentinitialization
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-agentinitialization
    spec:
      containers:
      - name: {{.Release.Name}}-agentinitialization
        image: busybox:1.35
        command: ["sh", "-c", "echo 'A2A Agent initialized'"]
        env:
        - name: RELEASE_NAME
          value: {{.Release.Name}}
        - name: COMPONENT_NAME
          value: {{.Release.Name}}-{{.Values.component.name}}
      restartPolicy: OnFailure
  backoffLimit: 3
