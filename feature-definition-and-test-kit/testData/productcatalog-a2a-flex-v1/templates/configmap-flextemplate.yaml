apiVersion: v1
kind: ConfigMap
metadata:
  # The FlexGateway operator reads this ConfigMap from the component namespace
  # using the reference: "<name>/a2a.yaml" set in gatewayConfiguration.template.
  name: {{ .Release.Name }}-{{ .Values.component.name }}-flextemplate
data:
  a2a.yaml: |
    - assetId: jwt-validation
      minorVersion: "0.11"
    - assetId: tracing
      minorVersion: "1.1"
    - assetId: header-injection
      minorVersion: "1.3"
    - assetId: a-two-a-agent-card
      minorVersion: "1.0"
    - assetId: agent-connection-telemetry
      minorVersion: "1.0"
