apiVersion: oda.tmforum.org/v1beta3
kind: Component
metadata:
  name: {{.Release.Name}}-{{.Values.component.name}}
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
spec:
  id: {{.Values.component.id}}
  name: {{.Values.component.name}}
  functionalBlock: {{.Values.component.functionalBlock}}
  publicationDate: {{.Values.component.publicationDate}}
  status: specified
  version: {{.Values.component.version}}
  description: "Simple Product Catalog ODA-Component from Open-API reference implementation."
  maintainers:
  - name: Lester Thomas
    email: lester.thomas@vodafone.com
  owners:
    - name: Lester Thomas
      email: lester.thomas@vodafone.com
  coreFunction:
    exposedAPIs:
    - name: productcatalogmanagement
      specification:
      - "https://raw.githubusercontent.com/tmforum-apis/TMF620_ProductCatalog/master/TMF620-ProductCatalog-v4.0.0.swagger.json"
      implementation: {{.Release.Name}}-prodcatapi
      apiType: openapi
      apiKeyVerification: {{.Values.component.apipolicy.apiKeyVerification | toYaml | nindent 8}}
      rateLimit: {{.Values.component.apipolicy.rateLimit | toYaml | nindent 8}}
      quota: {{.Values.component.apipolicy.quota | toYaml | nindent 8}}
      OASValidation: {{.Values.component.apipolicy.OASValidation | toYaml | nindent 8}}
      CORS: {{.Values.component.apipolicy.CORS | toYaml | nindent 8}}
      template: "{{.Values.component.apipolicy.template}}"
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productCatalogManagement/v4
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productCatalogManagement/v4/docs
      port: 8080
    dependentAPIs:
    {{- if .Values.component.dependentAPIs.enabled }}
    - name: downstreamproductcatalog
      apiType: openapi
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF620_ProductCatalog/master/TMF620-ProductCatalog-v4.0.0.swagger.json
    {{- else }}
      []
    {{- end }}
  eventNotification:
    publishedEvents: []
    subscribedEvents: []
  managementFunction:
    exposedAPIs:
    - name: metrics
      apiType: prometheus
      apiKeyVerification: {{.Values.component.apipolicy.apiKeyVerification | toYaml | nindent 8}}
      rateLimit: {{.Values.component.apipolicy.rateLimit | toYaml | nindent 8}}
      quota: {{.Values.component.apipolicy.quota | toYaml | nindent 8}}
      OASValidation: {{.Values.component.apipolicy.OASValidation | toYaml | nindent 8}}
      CORS: {{.Values.component.apipolicy.CORS | toYaml | nindent 8}}
      template: "{{.Values.component.apipolicy.template}}"
      implementation: {{.Release.Name}}-{{.Values.component.name}}-sm
      path: /{{.Release.Name}}-{{.Values.component.name}}/metrics
      port: 4000
  securityFunction:
    controllerRole: {{ .Values.security.canvasSystemRole }}
    exposedAPIs:
    {{- if .Values.permissionspec.enabled }}
    - name: userrolesandpermissions
      specification:
      - "https://raw.githubusercontent.com/tmforum-oda/reference-example-components/master/source/ProductCatalog/permissionSpecificationSetMicroservice/implementation/api/TMF672-Roles_And_Permissions-v5.0.0.oas.yaml"
      implementation: {{.Release.Name}}-permissionspecapi
      apiType: openapi
      apiKeyVerification: {{.Values.component.apipolicy.apiKeyVerification | toYaml | nindent 8}}
      rateLimit: {{.Values.component.apipolicy.rateLimit | toYaml | nindent 8}}
      quota: {{.Values.component.apipolicy.quota | toYaml | nindent 8}}
      OASValidation: {{.Values.component.apipolicy.OASValidation | toYaml | nindent 8}}
      CORS: {{.Values.component.apipolicy.CORS | toYaml | nindent 8}}
      template: "{{.Values.component.apipolicy.template}}"
      path: /{{.Release.Name}}-{{.Values.component.name}}/rolesAndPermissionsManagement/v5
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/rolesAndPermissionsManagement/v5/docs
      port: 8080
    {{- else }}
    - name: partyrole
      specification:
      - "https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRole/master/TMF669-PartyRole-v4.0.0.swagger.json"
      implementation: {{.Release.Name}}-partyroleapi
      apiType: openapi
      apiKeyVerification: {{.Values.component.apipolicy.apiKeyVerification | toYaml | nindent 8}}
      rateLimit: {{.Values.component.apipolicy.rateLimit | toYaml | nindent 8}}
      quota: {{.Values.component.apipolicy.quota | toYaml | nindent 8}}
      OASValidation: {{.Values.component.apipolicy.OASValidation | toYaml | nindent 8}}
      CORS: {{.Values.component.apipolicy.CORS | toYaml | nindent 8}}
      template: "{{.Values.component.apipolicy.template}}"
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4/docs
      port: 8080
    {{- end }}
