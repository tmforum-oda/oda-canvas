{{- if .Values.hooks.waitForCredentials.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wait-for-keycloak-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-secret-waiter
      restartPolicy: Never
      containers:
        - name: wait-for-secret
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              SECRET_NAME="{{ .Release.Name }}-{{ .Values.component.name }}-secret"
              NAMESPACE="{{ .Release.Namespace }}"
              TIMEOUT_SECONDS="{{ .Values.hooks.waitForCredentials.timeoutSeconds }}"
              SLEEP_SECONDS="{{ .Values.hooks.waitForCredentials.pollIntervalSeconds }}"

              echo "Waiting for secret ${SECRET_NAME} in namespace ${NAMESPACE}"

              elapsed=0
              while true; do
                if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
                  CLIENT_ID=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.client_id}' | base64 -d 2>/dev/null || true)
                  CLIENT_SECRET=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" -o jsonpath='{.data.client_secret}' | base64 -d 2>/dev/null || true)

                  if [ -n "${CLIENT_ID}" ] && [ -n "${CLIENT_SECRET}" ]; then
                    echo "Secret ${SECRET_NAME} is ready."
                    echo "Secret client-id is: ${CLIENT_ID}"
                    echo "Waiting 180 seconds for secret volume propagation into the pod..."
                    sleep 180
                    exit 0
                  fi

                  echo "Secret exists but keys are not ready yet."
                else
                  echo "Secret ${SECRET_NAME} not found yet."
                fi

                if [ "${elapsed}" -ge "${TIMEOUT_SECONDS}" ]; then
                  echo "Timed out waiting for secret ${SECRET_NAME}"
                  exit 1
                fi

                sleep "${SLEEP_SECONDS}"
                elapsed=$((elapsed + SLEEP_SECONDS))
              done
{{- end }}