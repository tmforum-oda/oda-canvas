apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-productorderprocessor
  labels:
    oda.tmforum.org/componentName: {{.Release.Name}}-{{.Values.component.name}}
    carbon-aware: enabled
spec:
  replicas: {{.Values.processor.replicas}}
  selector:
    matchLabels:
      impl: {{.Release.Name}}-productorderprocessor
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-{{.Values.component.name}}
        impl: {{.Release.Name}}-productorderprocessor
        version: {{.Values.processor.versionLabel}}
    spec:
      containers:
      - name: {{.Release.Name}}-productorderprocessor
        image: {{.Values.processor.image}}
        env:
        - name: MONGODB_HOST
          value: {{.Release.Name}}-mongodb
        - name: MONGODB_PORT
          value: "{{.Values.mongodb.port}}"
        - name: MONGODB_DATABASE
          value: {{.Values.mongodb.database}}
        - name: NODE_ENV
          value: production
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        imagePullPolicy: Always
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
