# Default values for productinventory.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

component:
  id: TMFC005
  name: productinventory
  functionalBlock: CoreCommerce
  publicationDate: 2023-08-22T00:00:00.000Z
  version: "1.0.1"
  storageClassName: default
  apipolicy:
    apiKeyVerification:
      enabled: false
      location: "header"
    rateLimit:
      enabled: false
      identifier: "IP"
      limit: "6"
      interval: "pm"
    quota:
      identifier: ""
      limit: ""
    OASValidation:
      requestEnabled: false
      responseEnabled: false
      allowUnspecifiedHeaders: false
      allowUnspecifiedQueryParams: false
      allowUnspecifiedCookies: false
    CORS:
      enabled: false
      allowCredentials: false
      allowOrigins: "https://allowed-origin.com, https://allowed-origin2.com"
      handlePreflightRequests:
        enabled: false
        allowHeaders: "Accept, X-Requested-With, Content-Type, Access-Control-Request-Method, Access-Control-Request-Headers"
        allowMethods: "GET, POST"
        maxAge: 36000
    template: ""
  dependentAPIs:
    enabled: false
    rejectUnauthorizedCertificates: false
security:
  canvasSystemRole: canvasRole
mongodb:
  port: 27017
  database: tmf
api:
  image: tmforumodacanvas/productinventoryapi:1.0.0
  versionLabel: productinventoryapi-1.0.0
  otlp:
    console:
      enabled: false
    protobuffCollector:
      enabled: true
      url: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
metrics:
  image: tmforumodacanvas/productinventorymetrics:1.0.0
  versionLabel: productinventorymetrics-1.0.0
partyrole:
  image: tmforumodacanvas/partyroleapi:1.0.0
  versionLabel: partyroleapi-1.0.0
permissionspec:
  image: tmforumodacanvas/permissionspecapi:1.0.0
  versionLabel: permissionspecapi-1.0.0
  # Set to true to use permissionspec API instead of partyrole API
  enabled: true
canvasinfo:
  host: info.canvas.svc.cluster.local
  basepath: /
service:
  port: 80
roleinitialization:
  image: tmforumodacanvas/productinventory-roleinitialization:1.0.0
initialization:
  image: tmforumodacanvas/productinventoryinitialization:1.0.0
